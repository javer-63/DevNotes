<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Админка</title>
    <th:block th:replace="~{fragments/head :: head}"/>
</head>
<body class="admin-page">
<th:block th:replace="~{fragments/header :: header}"/>

<main class="container">
    <section class="mb-5">
        <h1>Статистика</h1>
        <div class="stats-grid">
            <div class="card stat-card">
                <div class="stat-label">Всего постов</div>
                <div class="stat-value" th:text="${posts}"></div>
            </div>
        </div>
    </section>

    <section class="mb-5" th:if="${lastPost}">
        <h2>Последний пост</h2>
        <article class="card">
            <div class="card-body">
                <h3 class="h5 mb-2">
                    <a th:href="@{'/posts/' + ${lastPost.url}}" th:text="${lastPost.title}"></a>
                </h3>
                <p th:text="${lastPost.description}" class="post-meta mb-0"></p>
            </div>
        </article>
    </section>

    <section class="mb-5" th:if="${topPosts}">
        <h2>Топ-5 постов по просмотрам</h2>
        <ul class="top-list">
            <li th:each="post : ${topPosts}">
                <a th:href="@{'/posts/' + ${post.url}}" th:text="${post.title}"></a>
                <span th:text="${post.views} + ' просмотров'"></span>
            </li>
        </ul>
    </section>
</main>

<th:block th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
