<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Редактирование поста</title>
    <th:block th:replace="~{fragments/head :: head}"/>
    <script src="/tinymce/js/tinymce/tinymce.min.js"></script>
</head>
<body class="edit-page">
<div class="container">
    <div class="admin-container">
        <h1 class="mb-4">Редактирование поста</h1>
        <form id="editForm" method="post" th:action="@{'/posts/' + ${post.url} + '/edit'}" class="card shadow-sm">
            <div class="card-body">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">Заголовок</label>
                    <input type="text" name="title" th:value="${postRequest.title}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Время просмотра (мин)</label>
                    <input type="number" name="time" th:value="${postRequest.time}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <input type="text" name="description" th:value="${postRequest.description}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Содержание</label>
                    <textarea id="content" name="content" rows="14" class="form-control" th:utext="${postRequest.content}"></textarea>
                </div>

                <div class="d-flex gap-2 btn-group">
                    <button type="submit" class="btn btn-outline-dark">Сохранить</button>
                    <button type="button" id="cancelBtn" class="btn btn-outline-dark">Отмена</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script th:if="${errorMessage}">
    alert("[[${errorMessage}]]");
</script>
<script>
    tinymce.init({
        license_key: 'gpl',
        selector: '#content',
        height: 520,
        menubar: false,
        plugins: 'link lists code',
        toolbar: 'formatselect | bold italic underline | h1 h2 h3 h4 | bullist numlist | link | code',
        relative_urls: false,
        remove_script_host: true
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
        window.location.href = "/posts/[[${post.url}]]";
    });
</script>
</body>
</html>
