<th:block th:fragment="header" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
    <nav class="navbar">
        <a class="navbar-brand" href="/">/dev-notes</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/posts">Все посты</a>
            <a class="nav-link" href="https://github.com/javer-63/DevNotes">О проекте</a>
            <a class="nav-link" href="/admin" sec:authorize="isAnonymous()">Вход (админ)</a>
            <a class="nav-link" href="/posts/new" sec:authorize="hasRole('ADMIN')">Новый пост</a>
            <a class="nav-link" href="/admin" sec:authorize="hasRole('ADMIN')">Админка</a>
            <form th:action="@{/logout}" method="post" sec:authorize="hasRole('ADMIN')" class="mb-0">
                <button type="submit" class="nav-link nav-link-danger"
                        style="background:none;border:none;cursor:pointer;font-family:inherit;font-size:.85rem;">Выйти</button>
            </form>
        </div>
    </nav>
</th:block>
