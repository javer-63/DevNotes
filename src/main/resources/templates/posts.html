<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Все посты</title>
    <th:block th:replace="~{fragments/head :: head}"/>
    <link rel="canonical" th:href="${canonicalUrl}"/>
    <link rel="prev" th:if="${prevUrl != null}" th:href="${prevUrl}"/>
    <link rel="next" th:if="${nextUrl != null}" th:href="${nextUrl}"/>
</head>
<body class="posts-page">
<th:block th:replace="~{fragments/header :: header}"/>

<main class="container">
    <h1 class="mb-4">Все посты</h1>

    <section>
        <article th:each="post : ${posts}" class="card mb-3">
            <div class="card-body">
                <h2 class="h5 mb-2">
                    <a th:href="@{'/posts/' + ${post.url}}" th:text="${post.title}"></a>
                </h2>
                <p th:text="${post.description}" class="post-meta mb-0"></p>
            </div>
        </article>
    </section>

    <nav th:if="${totalPages > 1}" class="pagination">
        <a th:if="${currentPage > 1}" class="page-link"
           th:href="${currentPage == 2 ? '/posts' : '/posts/page/' + (currentPage - 1)}">←</a>
        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
            <a th:if="${i != currentPage}" class="page-link"
               th:href="${i == 1 ? '/posts' : '/posts/page/' + i}" th:text="${i}"></a>
            <span th:if="${i == currentPage}" th:text="${i}" class="page-current"></span>
        </th:block>
        <a th:if="${currentPage < totalPages}" class="page-link"
           th:href="${'/posts/page/' + (currentPage + 1)}">→</a>
    </nav>
</main>

<th:block th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
